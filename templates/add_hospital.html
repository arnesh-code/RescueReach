<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Hospital - RescueReach</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/admin/dashboard">
            🚑 RescueReach Admin
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h1 class="h3 mb-4">
                        ➕ Add Hospital
                    </h1>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Hospital Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter hospital name"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                                rows="3"
                                placeholder="Enter hospital address"
                                required
                            ></textarea>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Latitude
                                </label>

                                <input
                                    type="number"
                                    name="latitude"
                                    class="form-control"
                                    step="any"
                                    placeholder="Example: 13.0827000"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Longitude
                                </label>

                                <input
                                    type="number"
                                    name="longitude"
                                    class="form-control"
                                    step="any"
                                    placeholder="Example: 80.2707000"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                            >

                        </div>


                        <div class="d-flex gap-2">

                            <a
                                href="/admin/hospitals"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                Add Hospital
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
