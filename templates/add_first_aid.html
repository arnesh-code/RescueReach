<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add First Aid - RescueReach</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/admin/dashboard">
            🚑 RescueReach Admin
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h1 class="h3 mb-4">
                        ➕ Add First-Aid Topic
                    </h1>

                    <form method="POST">

                        <h5 class="text-danger mb-3">
                            English Content
                        </h5>

                        <div class="mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                name="title_en"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description_en"
                                class="form-control"
                                rows="3"
                            ></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                First-Aid Steps
                            </label>

                            <textarea
                                name="steps_en"
                                class="form-control"
                                rows="5"
                            ></textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Warning
                            </label>

                            <textarea
                                name="warning_en"
                                class="form-control"
                                rows="3"
                            ></textarea>

                        </div>


                        <hr class="my-4">


                        <h5 class="text-danger mb-3">
                            தமிழ் உள்ளடக்கம்
                        </h5>

                        <div class="mb-3">

                            <label class="form-label">
                                தலைப்பு
                            </label>

                            <input
                                type="text"
                                name="title_ta"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                விளக்கம்
                            </label>

                            <textarea
                                name="description_ta"
                                class="form-control"
                                rows="3"
                            ></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                முதலுதவி படிகள்
                            </label>

                            <textarea
                                name="steps_ta"
                                class="form-control"
                                rows="5"
                            ></textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                எச்சரிக்கை
                            </label>

                            <textarea
                                name="warning_ta"
                                class="form-control"
                                rows="3"
                            ></textarea>

                        </div>


                        <div class="d-flex gap-2">

                            <a
                                href="/admin/first-aid"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                ➕ Add Topic
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
