<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Locator - RescueReach</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-danger">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                🚑 RescueReach
            </a>

        </div>

    </nav>


    <main class="container py-5">

        <h1 class="text-center mb-4">
    📍 Hospital Locator
</h1>

<p class="text-center text-muted mb-4">
    Find hospitals near your current location.
</p>

<div class="text-center mb-5">

    <button
        id="findHospitalsBtn"
        class="btn btn-danger btn-lg"
        onclick="findNearbyHospitals()"
    >
        📍 Find Nearby Hospitals
    </button>

    <p id="locationStatus" class="mt-3 text-muted"></p>

</div>

        

    <div id="hospitalList" class="row">

        {% for hospital in hospitals %}

        <div class="col-md-6 col-lg-4 mb-4 hospital-card">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h2 class="h5">
                        🏥 {{ hospital.name }}
                    </h2>

                    <p>
                        <strong>Address:</strong><br>
                        {{ hospital.address }}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        {{ hospital.phone }}
                    </p>

                    <p>
                        <strong>Coordinates:</strong><br>
                        {{ hospital.latitude }},
                        {{ hospital.longitude }}
                    </p>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

    <!-- BACK TO HOME BUTTON -->

    <div class="text-center mt-4 mb-4">

        <a
            href="/"
            class="btn btn-outline-danger"
        >
            ← Back to Home
        </a>

    </div>


</main>


<script>

function findNearbyHospitals() {

    const status = document.getElementById("locationStatus");

    status.textContent = "Requesting your location...";

    if (!navigator.geolocation) {

        status.textContent =
            "Geolocation is not supported by this browser.";

        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            status.textContent =
                "Location detected successfully! Finding nearby hospitals...";

            window.location.href =
                "/nearby-hospitals?latitude=" +
                latitude +
                "&longitude=" +
                longitude;

        },

        function(error) {

            if (error.code === 1) {
                status.textContent =
                    "Location permission was denied.";
            }
            else if (error.code === 2) {
                status.textContent =
                    "Your location could not be determined.";
            }
            else if (error.code === 3) {
                status.textContent =
                    "Location request timed out.";
            }
            else {
                status.textContent =
                    "Unable to get your location.";
            }

        }

    );

}

</script>

</body>
</html>

</body>

</html>
