<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage First Aid - RescueReach</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/admin/dashboard">
            🚑 RescueReach Admin
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>🩹 Manage First-Aid Topics</h1>

            <p class="text-muted">
                Manage English and Tamil first-aid guidance.
            </p>
        </div>

        <div class="d-flex gap-2">

            <a
                href="/admin/dashboard"
                class="btn btn-outline-danger"
            >
                ← Dashboard
            </a>

            <a
                href="/admin/first-aid/add"
                class="btn btn-danger"
            >
                ➕ Add Topic
            </a>

        </div>

    </div>


    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-danger">

                <tr>

                    <th>ID</th>

                    <th>English Title</th>

                    <th>Tamil Title</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                {% for topic in topics %}

                <tr>

                    <td>{{ topic.id }}</td>

                    <td>
                        <strong>{{ topic.title_en }}</strong>
                    </td>

                    <td>
                        {{ topic.title_ta }}
                    </td>

                    <td>

                        <a
                            href="/admin/first-aid/edit/{{ topic.id }}"
                            class="btn btn-sm btn-outline-primary"
                        >
                            ✏️ Edit
                        </a>

                        <form
                            method="POST"
                            action="/admin/first-aid/delete/{{ topic.id }}"
                            style="display: inline;"
                            onsubmit="return confirm('Are you sure you want to delete this first-aid topic?');"
                        >

                            <button
                                type="submit"
                                class="btn btn-sm btn-outline-danger"
                            >
                                🗑️ Delete
                            </button>

                        </form>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</main>

</body>

</html>
